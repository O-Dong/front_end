<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>드롭다운 메뉴</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding-top: 50px;
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /*공통 네비게이션 바 스타일*/
    .navbar {
      background-color: #333;
      color: white;
      display: flex;
      justify-content: center;
      margin-bottom: 50px;
    }

    .nav-items > li {
      float: left /*메뉴 항목들을 가로로 나열*/
    }

    .nav-items > li > a {
      display: block;
      padding: 15px 20px;
    }

    /*드롭다운 공통 스타일*/
    .dropdown {
      position: relative; /*하위 메뉴 위치의 기준점*/
    }

    .dropdown-content {
      background-color: #555;
      position: absolute;
      top: 100%; /*부모 메뉴 바로 아래에 위치*/
      left: 0;
      min-width: 160px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      z-index: 1;

      /*기본적으로 숨김*/
      display: none;
    }

    .dropdown-content a {
      display: block;
      padding: 12px 16px;
    }

    .dropdown-content a:hover {
      background-color: #777;
    }

    /*CSS 호버 방식*/
    .dropdown.hover-dropdown:hover .dropdown-content {
      display: block;
    }

    /*JavaScript 클릭 방식*/
    .dropdown.click-dropdown .dropdown-content.show {
      display: block;
    }
  </style>
</head>
<body>
  
  <h2 style="text-align: center">1. 마우스 호버 방식</h2>
  <nav class="navbar">
    <ul class="nav-items">
      <li><a href="#">HOME</a></li>
      <li class="dropdown hover-dropdown">
        <a href="#">서비스 ▼</a>
        <div class="dropdown-content">
          <a href="#">웹 개발</a>
          <a href="#">앱 개발</a>
          <a href="#">디자인</a>
        </div>
      </li>
      <li><a href="#">포트폴리오</a></li>
      <li><a href="#">문의하기</a></li>
    </ul>
  </nav>

  <h2 style="text-align: center;">2. 클릭 방식</h2>
  <nav class="navbar">
    <ul class="nav-items">
      <li><a href="#">HOME</a></li>
      <li class="dropdown click-dropdown">
        <a href="#" class="dropdown-toggle">제품 ▼</a>
        <div class="dropdown-content">
          <a href="#">제품 A</a>
          <a href="#">제품 B</a>
          <a href="#">제품 C</a>
        </div>
      </li>
      <li><a href="#">회사소개</a></li>
      <li><a href="#">고객센터</a></li>
    </ul>
  </nav>

  <script>
    // 클릭 방식 드롭 다운 로직
    const clickDropdown = document.querySelector('.click-dropdown');
    const toggleButton = document.querySelector('.dropdown-toggle');
    const dropdownContent = clickDropdown.querySelector('.dropdown-content');

    toggleButton.addEventListener('click', (event) => {
      // a 태그의 기본 동작을 막음
      event.preventDefault();

      // 'show' 클래스를 토글하여 드롭다운을 보이거나 숨김
      dropdownContent.classList.toggle('show');
    });

    // 드롭다운 외부를 클릭했을 때 메뉴가 닫히도록 하는 로직
    window.addEventListener('click', (event) => {
      // 클릭된 요소가 드롭다운 메뉴 관련 요소가 아니라면
      if (!clickDropdown.contains(event.target)){
        dropdownContent.classList.remove('show');
      }
    });
  </script>
</body>
</html>
